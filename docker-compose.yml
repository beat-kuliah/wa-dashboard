services:
  postgres:
    image: postgres:18-alpine
    container_name: wa-dashboard-postgres
    environment:
      POSTGRES_USER: wa_dashboard
      POSTGRES_PASSWORD: wa_dashboard
      POSTGRES_DB: wa_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_dashboard -d wa_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: wa-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

